[package]
name = "emergent-light"
version = "2.3.0"
description = "深海涌现光点 — 桌面壁纸"
authors = ["Emergent Light Dev"]
edition = "2021"

[lib]
name = "emergent_light_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_StationsAndDesktops", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_HiDpi"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
